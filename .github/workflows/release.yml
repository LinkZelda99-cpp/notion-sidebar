name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release_notes:
        description: "Release notes (one bullet per line, without the leading '- ')"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update changelog
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'CHANGELOG.md';
          const notes = process.env.RELEASE_NOTES
            .split(/\\r?\\n/)
            .map(line => line.trim())
            .filter(Boolean)
            .map(line => line.startsWith('- ') ? line : `- ${line}`)
            .join('\\n');

          if (!notes) {
            throw new Error('Release notes cannot be empty.');
          }

          const changelog = fs.readFileSync(path, 'utf8');
          const date = new Date().toISOString().slice(0, 10);
          const entry = `## [${process.env.VERSION}] - ${date}\\n\\n${notes}\\n\\n`;

          const marker = '# Change Log\\n';
          if (!changelog.startsWith(marker)) {
            throw new Error('CHANGELOG.md does not start with the expected header.');
          }

          fs.writeFileSync(path, changelog.replace(marker, marker + '\\n' + entry));
          NODE

      - name: Package VSIX
        run: npx vsce package

      - name: Verify release files
        run: |
          test -f "notion-sidebar-$VERSION.vsix"
          grep -q "## [$VERSION]" CHANGELOG.md
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce@4.0.0 publish --oidc --packagePath "notion-sidebar-$VERSION.vsix"

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"

      - name: Create Git tag
        run: git tag "v$VERSION"

      - name: Push release commit and tag
        run: |
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\\n' "$RELEASE_NOTES" | sed 's/^/- /' > release-notes.md
          gh release create "v$VERSION" "notion-sidebar-$VERSION.vsix" \
            --title "Notion Sidebar v$VERSION" \
            --notes-file release-notes.md
